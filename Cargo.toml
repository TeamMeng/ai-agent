[package]
name = "ai-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["TeamMeng <862915265@qq.com>"]
license = "MIT"

[[example]]
name = "stream_chat"
path = "examples/stream_chat.rs"

[[example]]
name = "tool_call_complete"
path = "examples/tool_call_complete.rs"

[[example]]
name = "agent_runtime"
path = "examples/agent_runtime.rs"

[[example]]
name = "file_explorer"
path = "examples/file_explorer.rs"

[dependencies]
anyhow = "1.0"
async-openai = { version = "0.43.0", features = [
  "chat-completion",
  "embedding",
] }
async-stream = "0.3.6"
async-trait = "0.1.92"
backon = "1.6.0"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
csv = "1.4.0"
dotenvy = "0.15.7"
futures = "0.3.34"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiktoken-rs = "0.12.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["v4"] }
zip = { version = "9.6.0", default-features = false, features = [
  "deflate-flate2-zlib-rs",
] }

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
