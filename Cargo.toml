[package]
name = "ai-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["TeamMeng <862915265@qq.com>"]
license = "MIT"

[[example]]
name = "stream_chat"
path = "examples/stream_chat.rs"

[[example]]
name = "tool_call_complete"
path = "examples/tool_call_complete.rs"

[dependencies]
anyhow = "1.0"
async-openai = { version = "0.43.0", features = ["chat-completion"] }
async-stream = "0.3.6"
async-trait = "0.1.92"
backon = "1.6.0"
dotenvy = "0.15.7"
futures = "0.3.34"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
